# /etc/nginx/sites-available/keeperkit
# Reverse-proxies the public web port (80) into the FastAPI app on 8000.
# Drop into /etc/nginx/sites-available/, symlink to sites-enabled/, reload.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Upload limit: KeeperHub workflow JSON can be large.
    client_max_body_size 4m;

    access_log /var/log/nginx/keeperkit.access.log;
    error_log  /var/log/nginx/keeperkit.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Streaming-friendly defaults.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;
    }

    # Static assets directly from the package's static dir.
    location /static/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        expires            7d;
        add_header         Cache-Control "public, max-age=604800, immutable";
    }
}
